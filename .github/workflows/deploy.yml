# .github/workflows/deploy.yml
name: Build & Deploy

on:
  push:
    branches: [ main ]  # Запуск ТОЛЬКО при пуше в main

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Убрали сложные if — запуск при любом пуше в main
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Hetzner via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e  # Остановиться при первой ошибке
            cd /opt/joomla-pg
            
            echo "🔄 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "🔨 Building API image for ARM64..."
            docker compose -f docker-compose.yml build --no-cache api
            
            echo "🚀 Starting services..."
            docker compose -f docker-compose.yml up -d --remove-orphans
            
            echo "⏳ Waiting for services to start..."
            sleep 20
            
            echo "🏥 Health check..."
            curl -f http://127.0.0.1:3000/api/health || { echo "❌ Health check failed"; exit 1; }
            
            echo "🧹 Cleaning old images..."
            docker image prune -f --filter="until=24h"
            
            echo "✅ Deploy completed successfully!"