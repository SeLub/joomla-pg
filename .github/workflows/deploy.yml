# .github/workflows/deploy.yml
name: Build & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ closed ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Деплой при пуше в main ИЛИ при мердже пул-реквеста в main
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Hetzner via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e  # ✅ Выход при любой ошибке
            
            echo "🚀 Starting deploy to /opt/reev..."
            cd /opt/reev
            
            # =============================================================================
            # 1. Обновляем код из репозитория
            # =============================================================================
            echo "📦 Fetching latest code..."
            git fetch origin main
            git reset --hard origin/main
            
            # =============================================================================
            # 2. Проверяем критичные файлы конфигурации
            # =============================================================================
            echo "🔐 Checking configuration files..."
            
            # Проверка .env (обязателен!)
            if [ ! -f .env ]; then
              echo "❌ ERROR: .env file not found at /opt/reev/.env"
              echo "💡 Please create it manually or restore from backup"
              exit 1
            fi
            echo "✅ .env found"
            
            # Проверка/создание папки traefik
            mkdir -p traefik
            
            # Проверка traefik.yml (если нет — создаём минимальный конфиг)
            if [ ! -f traefik/traefik.yml ]; then
              echo "⚠️ traefik/traefik.yml not found, creating minimal config..."
              cat > traefik/traefik.yml << 'EOF'
api:
  dashboard: true
  insecure: false
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint: { to: websecure, scheme: https }
  websecure:
    address: ":443"
    http:
      tls: { certResolver: letsencrypt }
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  file:
    filename: /etc/traefik/traefik.yml
    watch: true
certificatesResolvers:
  letsencrypt:
    acme:
      email: your-email@example.com
      storage: /acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers: ["1.1.1.1:53", "8.8.8.8:53"]
EOF
              echo "⚠️ Please update traefik/traefik.yml with your email and restart"
            fi
            echo "✅ traefik/traefik.yml ready"
            
            # Проверка acme.json (права 600)
            if [ ! -f traefik/acme.json ]; then
              echo "🔐 Creating empty acme.json with secure permissions..."
              touch traefik/acme.json
              chmod 600 traefik/acme.json
            fi
            echo "✅ traefik/acme.json ready"
            
            # =============================================================================
            # 3. Собираем и запускаем сервисы
            # =============================================================================
            echo "🔨 Building images (api + astro)..."
            docker compose -f docker-compose.prod.yml build --no-cache api astro
            
            echo "🚀 Starting services..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # =============================================================================
            # 4. Ждём инициализации и проверяем здоровье
            # =============================================================================
            echo "⏳ Waiting for services to initialize..."
            sleep 30  # Даём время на миграции БД и старт приложений
            
            # 🔹 Внутренняя проверка API (через docker exec)
            echo "🔍 Checking API health (internal)..."
            if docker exec reev-api curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "✅ API internal health check passed"
            else
              echo "⚠️ API internal health check failed — checking logs..."
              docker compose -f docker-compose.prod.yml logs --tail=20 api || true
              # Не прерываем деплой, но логируем предупреждение
            fi
            
            # 🔹 Внутренняя проверка Astro (через docker exec)
            echo "🔍 Checking Astro health (internal)..."
            if docker exec reev-astro curl -sf http://localhost:4321/ > /dev/null 2>&1; then
              echo "✅ Astro internal health check passed"
            else
              echo "⚠️ Astro internal health check failed — checking logs..."
              docker compose -f docker-compose.prod.yml logs --tail=20 astro || true
            fi
            
            # 🔹 Внешние проверки (опционально, могут падать из-за DNS/SSL)
            echo "🌐 Optional external checks..."
            curl -sf https://api.reev24.com/api/health > /dev/null 2>&1 && \
              echo "✅ External API check passed" || \
              echo "⚠️ External API check failed (DNS/SSL may still be propagating)"
              
            curl -sf https://reev24.com/ > /dev/null 2>&1 && \
              echo "✅ External Astro check passed" || \
              echo "⚠️ External Astro check failed (DNS/SSL may still be propagating)"
            
            # =============================================================================
            # 5. Очистка старых образов (экономия места на диске)
            # =============================================================================
            echo "🧹 Cleaning up old images..."
            docker image prune -f --filter="until=24h"
            
            # =============================================================================
            # ✅ Деплой завершён
            # =============================================================================
            echo ""
            echo "🎉 Deploy completed successfully!"
            echo "📊 Check status: docker compose -f docker-compose.prod.yml ps"
            echo "🔍 View logs: docker compose -f docker-compose.prod.yml logs -f"
            echo "🌐 Frontend: https://reev24.com"
            echo "🔌 API: https://api.reev24.com/api/health"