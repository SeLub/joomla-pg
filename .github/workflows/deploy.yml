# .github/workflows/deploy.yml
name: Build & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ closed ]

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with: { version: 9 }
      
      - name: Run API tests
        working-directory: ./api
        run: |
          pnpm install --frozen-lockfile
          pnpm test
      
      - name: Run Astro build check (type check + lint)
        working-directory: ./frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run check  # astro check + eslint + tsc --noEmit

  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    needs: test
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Hetzner via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /opt/reev  # ✅ Обновлённый путь
            
            # 1. Обновляем код
            git fetch origin main
            git reset --hard origin/main
            
            # 2. Собираем образы (API + Astro)
            docker compose -f docker-compose.prod.yml build --no-cache api astro
            
            # 3. Запускаем/перезапускаем сервисы
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # 4. Ждём запуска и проверяем здоровье
            echo "Waiting for services to start..."
            sleep 20  # Astro может требовать больше времени на первый запуск
            
            # Health checks
            curl -f http://127.0.0.1:3000/api/health || { echo "❌ API health check failed"; exit 1; }
            curl -f http://127.0.0.1:4321/ || { echo "❌ Astro health check failed"; exit 1; }
            
            # 5. Очистка старых образов
            docker image prune -f --filter="until=24h"
            
            echo "✅ Deploy completed successfully"