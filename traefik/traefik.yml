# traefik/traefik.yml
global:
  checkNewVersion: true
  sendAnonymousUsage: false

# ===========================
# 🌐 Entry Points
# ===========================
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
      forwardedHeaders:
        insecure: true  # 👈 Критично для Cloudflare
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
      forwardedHeaders:
        insecure: true  # 👈 Критично для Cloudflare

# ===========================
# 📋 Providers
# ===========================
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false

# ===========================
# 🔐 Let's Encrypt (Cloudflare DNS)
# ===========================
certificatesResolvers:
  letsencrypt:
    acme:
      email: siteup24@gmail.com  # ✅ Ваш email
      storage: /acme.json
      dnsChallenge:
        provider: cloudflare
        delayBeforeCheck: 30  # 👈 Ждём пропагации DNS
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"

# ===========================
# 📊 Logs & Health
# ===========================
log:
  level: INFO
  format: common

accessLog:
  format: common
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop

ping:
  entryPoint: web

api:
  dashboard: true
  insecure: false