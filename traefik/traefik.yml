# traefik/traefik.yml
global:
  checkNewVersion: true
  sendAnonymousUsage: false

# ===========================
# 🌐 Entry Points
# ===========================
entryPoints:
  web:
    address: ":80"
    # ✅ forwardedHeaders напрямую в entryPoint (не в http!)
    forwardedHeaders:
      insecure: true
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    forwardedHeaders:
      insecure: true
    http:
      tls:
        certResolver: letsencrypt

# ===========================
# 📋 Providers
# ===========================
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false

# ===========================
# 🔐 Let's Encrypt (Cloudflare DNS)
# ===========================
certificatesResolvers:
  letsencrypt:
    acme:
      email: siteup24@gmail.com
      storage: /acme.json
      dnsChallenge:
        provider: cloudflare
        # ✅ Новый синтаксис для Traefik v3.6+
        propagation:
          delayBeforeCheck: 60  # 👈 Увеличили с 30 до 60 секунд
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"

# ===========================
# 📊 Logs & Health
# ===========================
log:
  level: INFO
  format: common

accessLog:
  format: common
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop

ping:
  entryPoint: web

api:
  dashboard: true
  insecure: false