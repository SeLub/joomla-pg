# docker-compose.yml
services:
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: joomla-pg
    ports:         
      - "5432:5432"
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: appsecret
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: joomla-redis
    volumes:
      - redisdata:/data
    restart: always

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: joomla-api
    environment:
      DATABASE_URL: postgresql://appuser:appsecret@postgres:5432/appdb
      REDIS_HOST: redis
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  joomla:
    image: joomla:latest
    container_name: joomla-app
    ports:
      - "80:80"
    environment:
      JOOMLA_DB_TYPE: pgsql
      JOOMLA_DB_HOST: postgres
      JOOMLA_DB_USER: joomlauser
      JOOMLA_DB_PASSWORD: joomlasecret
      JOOMLA_DB_NAME: appdb
      JOOMLA_DB_PREFIX: jos_

      PHP_UPLOAD_MAX_FILESIZE: "64M"
      PHP_POST_MAX_SIZE: "64M"
      PHP_MEMORY_LIMIT: "256M"
      PHP_MAX_EXECUTION_TIME: "300"
    volumes:
      - joomla_data:/var/www/html
      - ./template/templates/reev-joomla:/var/www/html/templates/reev-joomla
      - ./template/media/templates/site/reev-joomla:/var/www/html/media/templates/site/reev-joomla
      - ./template/templates/cassiopeia/css:/var/www/html/templates/cassiopeia/css:cached
      - ./template/templates/cassiopeia/js:/var/www/html/templates/cassiopeia/js:cached
      - ./template/templates/cassiopeia/html:/var/www/html/templates/cassiopeia/html:cached
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

volumes:
  pgdata:
  redisdata:
  joomla_data:
