# docker-compose.yml — локальная разработка (без Traefik)
version: '3.8'

services:
  # 🗄️ PostgreSQL с PostGIS
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: reev-postgres
    ports:
      - "5432:5432"  # ✅ Для локальной отладки (Prisma Studio, DBeaver)
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-appsecret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb}"]
      interval: 10s
      retries: 5
      start_period: 10s
    networks: [reev-net]

  # 🗃️ Redis
  redis:
    image: redis:7-alpine
    container_name: reev-redis
    ports:
      - "6379:6379"  # ✅ Для отладки (redis-cli)
    volumes:
      - redisdata:/data
    restart: unless-stopped
    networks: [reev-net]

networks:
  reev-net:
    driver: bridge

volumes:
  pgdata:
  redisdata: