services:
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: joomla-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb}"]
      interval: 10s
      retries: 5
      start_period: 30s
    networks:
      - app-net
    # 🔒 Порт 5432 НЕ пробрасываем! Доступ только изнутри сети app-net

  redis:
    image: redis:7-alpine
    container_name: joomla-redis
    volumes:
      - redisdata:/data
    restart: unless-stopped
    networks:
      - app-net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: joomla-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST:-joomla-redis}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      JWT_SHARED_SECRET: ${JWT_SHARED_SECRET}
    ports:
      # ✅ ОТКРЫВАЕМ НАРУЖУ: Доступ для WebSocket и внешних серверов
      - "0.0.0.0:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-net

  joomla:
    image: joomla:latest
    container_name: joomla-app
    ports:
      - "80:80"
      - "443:443"
    environment:
      JOOMLA_DB_TYPE: pgsql
      # ✅ КРИТИЧНО: используем имя сервиса 'postgres', а не container_name
      JOOMLA_DB_HOST: postgres
      JOOMLA_DB_USER: joomlauser
      JOOMLA_DB_PASSWORD: ${JOOMLA_DB_PASSWORD:-joomlasecret}
      JOOMLA_DB_NAME: ${POSTGRES_DB:-appdb}
      JOOMLA_DB_PREFIX: jos_
    volumes:
      - joomla_data:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-net

volumes:
  pgdata:
  redisdata:
  joomla_data:

networks:
  app-net:
    driver: bridge